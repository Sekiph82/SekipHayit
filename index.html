<style>
/* Layout: one phone-width column. B&W portrait bleeds into an ink-navy page; Povu's soap-bubble blue is the only colour. */
:root{
  --ink:#0b1622; --panel:#13212f; --line:#22364a;
  --fg:#eef4f9; --muted:#93a8ba;
  --bubble:#3fb4ec; --bubble-deep:#1670b8; --on-bubble:#04121e;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--fg);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.card{max-width:460px;margin:0 auto;padding-block:0 40px}
.hero{position:relative}
.hero img.photo{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;max-width:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--ink) 97%);pointer-events:none}
.lang{position:absolute;top:14px;right:16px;z-index:2;display:flex;background:rgba(11,22,34,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px}
.lang button{all:unset;cursor:pointer;font:600 12px/1 var(--body);letter-spacing:.08em;padding:7px 11px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.lang button:focus-visible{outline:2px solid var(--bubble)}
.wrap{padding-inline:20px;margin-top:-88px;position:relative;z-index:1;display:flex;flex-direction:column;gap:28px}
.id h1{font:700 clamp(34px,10vw,44px)/1.02 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.id p{margin:8px 0 0;color:var(--muted);font-weight:500}
.id .co{display:flex;align-items:center;gap:12px;margin-top:16px}
.id .co img{height:44px;width:auto}
.id .co span{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.save{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:16px;background:var(--bubble);color:var(--on-bubble);font:700 17px/1 var(--display);text-decoration:none;box-shadow:0 10px 30px -10px rgba(63,180,236,.6)}
.save:active{transform:scale(.98)}
.save:focus-visible,.act:focus-visible,.soc a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px 12px;border-radius:14px;background:var(--panel);color:var(--fg);text-decoration:none;font-size:12px;font-weight:600}
.act svg{width:22px;height:22px;color:var(--bubble)}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row dd{margin:0;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.row dd a{color:var(--fg);text-decoration:none}
.row dd .empty{color:var(--muted);font-style:italic}
h2{font:700 13px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.soc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.soc a{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--fg)}
.soc a svg{width:24px;height:24px}
.soc a[aria-disabled="true"]{opacity:.4;pointer-events:none}
.vids{display:flex;flex-direction:column;gap:12px}
.vid{position:relative;display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;border-radius:14px;background:radial-gradient(circle at 30% 30%,#1b3550,var(--panel));border:1px dashed var(--line);color:var(--muted);font-size:14px;text-decoration:none;overflow:hidden}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .play{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(63,180,236,.18);color:var(--bubble)}
.vid[href] .play{background:var(--bubble);color:var(--on-bubble)}
.vid .cap{position:absolute;left:14px;bottom:10px;font-size:13px}
.vplay{margin:0;display:flex;flex-direction:column;gap:8px}
.vplay video{display:block;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:14px;background:var(--panel)}
.vplay figcaption{font-size:14px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
function setLang(l){
  document.documentElement.lang=l;
  document.querySelectorAll('[data-'+l+']').forEach(e=>e.textContent=e.dataset[l]);
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  try{localStorage.setItem('lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let saved=null;try{saved=localStorage.getItem('lang')}catch(e){}
setLang(saved||((navigator.language||'tr').toLowerCase().startsWith('tr')?'tr':'en'));
</script>
